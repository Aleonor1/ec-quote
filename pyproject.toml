[project]
name = "ec-quote"
version = "0.1.0"
description = "Ofertare instant pentru Etichete Creative: un agent, doua canale (WhatsApp prin CRM, chat pe site)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "anthropic>=0.40",
  "Pillow>=11",
  "PyMuPDF>=1.24",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["ec_quote*"]

[tool.setuptools.package-data]
"ec_quote.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
